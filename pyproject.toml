[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lr4-robbercity"
version = "1.0.0"
description = "Лабораторна робота №4: злам триетапного XOR-протоколу (CodinGame)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8", "numpy>=1.26"]

[project.scripts]
robbercity = "robbercity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
